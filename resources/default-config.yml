---
# Default Claude Code Configuration Template
# Copy this file to your application root as .claude-code-config.yml

claudeCode:
  # Enable Claude Code CLI installation
  enabled: true

  # Claude Code CLI version (use "latest" or specify version like "2.0.50")
  version: "latest"

  # Authentication configuration
  authentication:
    # API key - will fall back to ANTHROPIC_API_KEY environment variable
    # It's recommended to use environment variables for sensitive data
    apiKey: ${ANTHROPIC_API_KEY}

  # CLI behavior settings
  settings:
    logLevel: "info"          # Log level: debug, info, warn, error
    model: "sonnet"            # Default model: sonnet, opus, haiku
    outputFormat: "text"       # Output format: text, json

  # MCP (Model Context Protocol) Servers
  # Note: MCP configuration will be fully implemented in Phase 2
  mcpServers: []

  # Example MCP servers (uncomment to enable):
  #
  # - name: filesystem
  #   type: stdio
  #   command: npx
  #   args:
  #     - "-y"
  #     - "@modelcontextprotocol/server-filesystem"
  #   env:
  #     ALLOWED_DIRECTORIES: "/home/vcap/app,/tmp"
  #
  # - name: github
  #   type: stdio
  #   command: npx
  #   args:
  #     - "-y"
  #     - "@modelcontextprotocol/server-github"
  #   env:
  #     GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
  #
  # - name: postgres
  #   type: stdio
  #   command: npx
  #   args:
  #     - "-y"
  #     - "@modelcontextprotocol/server-postgres"
  #   env:
  #     POSTGRES_CONNECTION_STRING: ${DATABASE_URL}

  # Skills Configuration
  # Skills extend Claude's capabilities with custom instructions and scripts
  #
  # Bundled Skills:
  # - Place Skills in .claude/skills/ directory in your application
  # - Each skill should be in its own subdirectory with a SKILL.md file
  # - Skills are automatically discovered during staging

  # Plugin Marketplaces Configuration
  # Install plugins from git-based marketplace repositories
  # Note: Requires network access during Cloud Foundry staging for git clone
  #
  # pluginMarketplaces: []
  #
  # Example plugin marketplaces (uncomment to enable):
  #
  # pluginMarketplaces:
  #   - name: my-marketplace           # Unique name for this marketplace
  #     source: https://github.com/org/claude-plugins.git  # Git repository URL
  #     branch: main                    # Optional: branch to clone (default: main)
  #     plugins:                        # List of plugins to install from this marketplace
  #       - plugin-name-1
  #       - plugin-name-2
  #
  #   - name: internal-plugins
  #     source: git@github.com:company/internal-claude-plugins.git  # SSH URL also supported
  #     plugins:
  #       - company-tool
  #
  # Plugin marketplace structure:
  # The marketplace repository should contain plugins in one of these structures:
  #   - plugins/<plugin-name>/plugin.json (or plugin.yml)
  #   - <plugin-name>/plugin.json (or plugin.yml)
  #
  # Skills within plugins are automatically extracted to .claude/skills/
  # This works around Claude Code issue #10113 where git marketplace skill paths
  # are incorrectly resolved.

